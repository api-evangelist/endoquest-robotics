aid: endoquest-robotics
name: EndoQuest Robotics
description: >-
  EndoQuest Robotics is a Houston, Texas medical device company — founded in 2017 and
  operating as ColubrisMX until its June 2022 rebrand — developing what it calls the
  world's first flexible endoluminal robotic surgical system. Its Endoluminal Surgical
  (ELS) System pairs an ergonomic physician console (high-definition monitor, hand
  controllers, foot pedals) with a mobile patient cart and positioning arm, driving two
  6mm flexible robotic instruments and a 3.7mm high-definition robotic camera through the
  EndoDrive, with up to seven degrees of freedom and additional channels for insufflation,
  suction, irrigation and third-party accessories. The design targets scar-free
  minimally invasive procedures inside the gastrointestinal tract — including appendectomy
  and cholecystectomy — performed through natural orifices or a single transumbilical
  incision. The company was accepted into the FDA's Safer Technologies Program in December
  2023, received an investigational device exemption in December 2024, and began first
  colorectal cases in its PARADIGM pivotal multicenter study in May 2025. The system is
  not FDA-cleared and is not for commercial sale. EndoQuest sells surgical robotics
  hardware, not software: it publishes no API, developer portal, SDK, or machine-readable
  contract of any kind, and its nine-page marketing site carries no developer surface.
